name: "Test kr8s"
on:
  pull_request:
    paths:
      - ".github/workflows/test-kr8s.yaml"
      - "kr8s/**"
      - "pyproject.toml"
      - "conftest.py"
  push:
    paths:
      - ".github/workflows/test-kr8s.yaml"
      - "kr8s/**"
      - "pyproject.toml"
      - "conftest.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        kubernetes-version: ["1.36.4"]
        include:
          - python-version: "3.14"
            kubernetes-version: 1.35.8
          - python-version: "3.14"
            kubernetes-version: 1.34.11
          - python-version: "3.14"
            kubernetes-version: 1.33.12
          - python-version: "3.14"
            kubernetes-version: 1.32.11
          - python-version: "3.14"
            kubernetes-version: 1.31.14
    env:
      KUBECONFIG: .pytest-kind/pytest-kind/kubeconfig

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Run tests
        env:
          KUBERNETES_VERSION: ${{ matrix.kubernetes-version }}
        run: uv run task test-ci
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Debug k8s resources
        if: always()
        run: kubectl get all -A

  minimal-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Test the minimal and maximal Python versions only
        python-version: ["3.9", "3.14"]
        kubernetes-version: ["1.36.4"]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      # The runner's own kind, for the reason conftest.py prefers it: the
      # action installs kind v0.31.0, which writes a `kubeadm.k8s.io/v1beta3`
      # cluster config that kubeadm refuses from 1.37 on.
      - name: Create k8s Kind Cluster
        run: kind create cluster --image kindest/node:v${{ matrix.kubernetes-version }} --wait 60s
      - name: Install kr8s
        run: pip install -e .
      - name: Ensure kr8s works
        run: python -c "import kr8s; print(list(kr8s.get('nodes')))"
